[global]
extend-enable = ["MD060", "MD063", "MD070", "MD080", "MD082", "MD083", "MD084", "MD085", "MD087", "MD089", "MD090"]
disable = ["MD013"]
include = ["**/*.md", "**/*.rs"]
exclude = ["template/**"]

[code-block-tools]
enabled = true
on-missing-language-definition = "fail"
on-missing-tool-binary = "fail-fast"

[code-block-tools.languages]
markdown = { lint = ["rumdl:lint"], format = ["rumdl:format"] }
toml = { lint = ["tombi:lint"], format = ["tombi:format"] }
rust = { format = ["rustfmt"] }
shell = { format = ["shfmt"] }
console = { enabled = false }

[MD004]
style = "asterisk"

[MD003]
style = "atx"

[MD032]
allow-lazy-continuation = false

[MD052]
shortcut-syntax = true

[MD063]
style = "title-case"

[MD076]
style = "tight"
allow-loose-continuation = false
