name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  MISE_CARGO_BINSTALL_ONLY: true
  MISE_LOCKED: true

jobs:
  ci:
    uses: $/.github/workflows/ci.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  audit:
    uses: $/.github/workflows/audit.yml
    permissions:
      contents: read
      issues: write

  release:
    name: Release
    runs-on: ubuntu-latest
    needs:
      - ci
      - audit
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
