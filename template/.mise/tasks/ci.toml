["ci"]
depends = [
  "ci:*",
  { task = "check:release --skip-ci" },
]

["ci-for-pre-release"]
depends = ["ci:*"]

["ci:check-rust"]
depends = [
  "show-version:rust",
  "check:rust",
]

["ci:check-rustdoc"]
depends = [
  "show-version:rust",
  "check:rustdoc",
]

[install-toolchains-for-ci-check-docs-rs]
depends = ["install-toolchains-for-check-docs-rs"]

["ci:check-docs-rs"]
depends = [
  "show-version:rust",
  "check:docs-rs",
]

["ci:lint-unused-deps"]
depends = [
  "show-version:rust",
  "lint:unused-deps",
]

["ci:lint-rustfmt"]
depends = [
  "show-version:rust",
  "format:rust --check",
]

["ci:lint-rust"]
depends = [
  "show-version:rust",
  "lint:rust",
]

["ci:test-rust"]
depends = [
  "show-version:rust",
  "test:rust",
]

["ci:coverage-rust"]
depends = [
  "show-version:rust",
  "coverage:rust --codecov --output-path=target/codecov.json",
]

[install-toolchains-for-ci-check-markdown]
depends = ["install-toolchains-for-sync-markdown"]

["ci:check-markdown"]
depends = ["sync:markdown --check"]

["ci:lint-toml"]
depends = [
  "format:toml --check",
  "lint:toml",
]

["ci:lint-workflow"]
depends = ["lint:workflow"]

["ci:lint-spelling"]
depends = ["lint:spelling"]

["ci:lint-markdown"]
depends = [
  "format:markdown --check",
  "lint:markdown",
]

["ci:lint-editorconfig"]
depends = ["lint:editorconfig"]

["ci:lint-shell"]
depends = [
  "format:shell --check",
  "lint:shell",
]

["ci:lint-renovate"]
depends = ["lint:renovate"]
