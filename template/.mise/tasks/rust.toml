["show-version:rust"]
description = "Show Rust toolchain version"
run = [
  "rustc -vV",
  "cargo -vV",
]

[install-nightly-toolchain]
description = "Install Rust nightly toolchain"
run = "rustup toolchain install nightly"

["format:rust"]
description = "Format Rust files"
usage = '''
flag "--check" help="Run rustfmt in check mode"
'''
raw_args = true
quiet = true
run = '''
#!/usr/bin/env bash
set -euxo pipefail
cargo fmt --all "$@"
'''

["check:rust"]
description = "Check Rust compilation across all target groups and exhaustive feature combinations"
usage = '''
flag "--locked" help="Assert that `Cargo.lock` will remain unchanged."
'''
raw_args = true
quiet = true
env = { CARGO_BUILD_WARNINGS = "deny" }
run = '''
#!/usr/bin/env bash
set -euxo pipefail
cargo hack --workspace --feature-powerset check "$@"
cargo hack --workspace --feature-powerset check "$@" --examples
cargo hack --workspace --feature-powerset check "$@" --tests
cargo hack --workspace --feature-powerset check "$@" --benches
cargo hack --workspace --feature-powerset check "$@" --all-targets
'''

["check:rustdoc"]
description = "Check rustdoc builds across exhaustive feature combinations"
usage = '''
flag "--locked" help="Assert that `Cargo.lock` will remain unchanged."
'''
raw_args = true
quiet = true
env = { CARGO_BUILD_WARNINGS = "deny" }
run = '''
#!/usr/bin/env bash
set -euxo pipefail
cargo hack --workspace --feature-powerset doc --no-deps "$@"
'''

[install-toolchains-for-check-docs-rs]
description = "Install Rust toolchain for docs.rs documentation checks"
depends = ["install-nightly-toolchain"]

["check:docs-rs"]
description = "Check docs.rs-compatible documentation builds"
depends = ["install-toolchains-for-check-docs-rs"]
usage = '''
flag "--locked" help="Assert that `Cargo.lock` will remain unchanged."
'''
raw_args = true
quiet = true
env = { CARGO_BUILD_WARNINGS = "deny" }
run = '''
#!/usr/bin/env bash
set -euxo pipefail
rustup run nightly bash ./scripts/cargo-hack-lib docs-rs "$@"
'''

["lint:unused-deps"]
description = "Check for unused dependencies"
run = "cargo machete"

["lint:rust"]
description = "Lint Rust across all target groups and exhaustive feature combinations"
usage = '''
flag "--locked" help="Assert that `Cargo.lock` will remain unchanged."
'''
raw_args = true
quiet = true
env = { CARGO_BUILD_WARNINGS = "deny" }
run = '''
#!/usr/bin/env bash
set -euxo pipefail
cargo hack --workspace --feature-powerset clippy "$@"
cargo hack --workspace --feature-powerset clippy "$@" --examples
cargo hack --workspace --feature-powerset clippy "$@" --tests
cargo hack --workspace --feature-powerset clippy "$@" --benches
cargo hack --workspace --feature-powerset clippy "$@" --all-targets
'''

["test:rust"]
description = "Run Rust tests across exhaustive feature combinations"
usage = '''
flag "--locked" help="Assert that `Cargo.lock` will remain unchanged."
'''
raw_args = true
quiet = true
run = '''
#!/usr/bin/env bash
set -euxo pipefail
cargo hack --workspace --feature-powerset test "$@"
'''

["coverage:rust"]
description = "Run Rust tests with coverage"
usage = '''
flag "--codecov" help="Export coverage data in \"Codecov Custom Coverage\" format"
flag "--output-path <output>" help="Specify a file to write coverage data into."
flag "--locked" help="Assert that `Cargo.lock` will remain unchanged."
'''
raw_args = true
quiet = true
# Internal note: intentionally uses --all-features (not --feature-powerset).
# Reason: powerset-style repeated runs can overwrite codecov output.
run = '''
#!/usr/bin/env bash
set -euxo pipefail
cargo llvm-cov --workspace --all-features "$@" test
'''
