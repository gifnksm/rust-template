[settings]
lockfile = true
cargo.binstall_only = true
cargo.binstall_quickinstall = true
lockfile_platforms = [
  "linux-x64",
  "linux-arm64",
  "macos-arm64",
  "windows-x64",
  "windows-arm64",
]

[tools]
actionlint = "1.7.12"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
cargo-binstall = "1.24.0"  # lets mise install cargo:* tools from binaries instead of compiling them
cargo-deny = "0.20.2"
"cargo:cargo-about" = "0.9.2"
"cargo:cargo-docs-rs" = "1.0.4"
"cargo:cargo-generate" = "0.25.0"
"cargo:cargo-hack" = "0.6.45"
"cargo:cargo-machete" = "0.9.2"
"cargo:cargo-release" = "1.1.6"
"cargo:cargo-sync-rdme" = "0.8.1"
editorconfig-checker = "4.0.2"
just = "1.58.0"
rumdl = "0.2.78"
shellcheck = "0.11.0"
shfmt = "3.14.1"
tombi = "1.6.1"
typos = "1.50.3"
uv = "0.12.22"
