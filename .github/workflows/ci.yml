name: CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  MISE_CARGO_BINSTALL_ONLY: true
  MISE_LOCKED: true

jobs:
  generate:
    name: Generate
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        crate_type: ["bin", "lib"]
    timeout-minutes: 5
    env:
      PROJECT_NAME: rust-template-generated-${{ matrix.crate_type }}
      CRATE_TYPE: ${{ matrix.crate_type }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - run: rustup toolchain install nightly --profile minimal
        shell: bash
      - run: gh extension install github/gh-actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
      - uses: jdx/mise-action@v5.2.4
        with:
          github_token: ${{ github.token }}
          persist_github_token: true
      - run: MISE_LOCKED=false cargo generate --name "${PROJECT_NAME}" --path "template" --template-values-file tests/template_values.toml "--${CRATE_TYPE}" --allow-commands
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
      - name: CI check
        env:
          JACTIONLINT_ONLINE: 1
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd "${PROJECT_NAME}"
          git init
          cargo generate-lockfile
          gh actions-lock
          mise lock
          git config --local user.name "Dummy User"
          git config --local user.email "dummy@example.com"
          git add .
          git commit -m "Initial commit"
          ../tests/scripts/run_ci "${CRATE_TYPE}"
        shell: bash

  sync-repo-dry-run:
    name: Sync Example Repo with Template (Dry Run)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        crate_type: ["bin", "lib"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/sync-repo
        with:
          crate-type: ${{ matrix.crate_type }}
          github-token: ${{ github.token }}
          git-user-name: "Dummy User"
          git-user-email: "dummy@example.com"
          dry-run: "true"

  lint-workflow:
    name: Lint (workflow)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.4
        with:
          github_token: ${{ github.token }}
          persist_github_token: true
      - run: mise run lint:workflow
        env:
          JACTIONLINT_ONLINE: 1
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash

  lint-spelling:
    name: Lint (spelling)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.4
        with:
          github_token: ${{ github.token }}
          persist_github_token: true
      - run: mise run lint:spelling
        shell: bash

  lint-markdown:
    name: Lint (markdown)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.4
        with:
          github_token: ${{ github.token }}
          persist_github_token: true
      - run: mise run lint:markdown
        shell: bash

  lint-editorconfig:
    name: Lint (editorconfig)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.4
        with:
          github_token: ${{ github.token }}
          persist_github_token: true
      - run: mise run lint:editorconfig
        shell: bash

  lint-shell:
    name: Lint (shell)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.4
        with:
          github_token: ${{ github.token }}
          persist_github_token: true
      - run: mise run lint:shell
        shell: bash

  lint-renovate:
    name: Lint (renovate)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.4
        with:
          github_token: ${{ github.token }}
          persist_github_token: true
      - run: mise run lint:renovate
        shell: bash

  ci-complete:
    name: ci-complete
    if: ${{ always() }}
    needs:
      - generate
      - sync-repo-dry-run
      - lint-workflow
      - lint-spelling
      - lint-markdown
      - lint-editorconfig
      - lint-shell
      - lint-renovate
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: CI complete
        env:
          RESULT: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: |
          if "${RESULT}"; then
            echo "CI succeeded"
          else
            echo "CI failed"
            exit 1
          fi
        shell: bash
