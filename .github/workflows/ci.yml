name: CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  MISE_CARGO_BINSTALL_ONLY: true
  MISE_LOCKED: true

jobs:
  generate:
    name: Generate
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        rust: [stable]
        job:
          - crate_type: "bin"
          - crate_type: "lib"
    timeout-minutes: 5
    env:
      PROJECT_NAME: rust-template-generated-${{ matrix.job.crate_type }}
      CRATE_TYPE: ${{ matrix.job.crate_type }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - run: rustup toolchain install nightly --profile minimal
        shell: bash
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          github_token: ${{ github.token }}
          persist_github_token: true
      - run: MISE_LOCKED=false cargo generate --name "${PROJECT_NAME}" --path "template" --template-values-file tests/template_values.toml "--${CRATE_TYPE}" --allow-commands
        shell: bash
      - name: CI check
        env:
          JACTIONLINT_ONLINE: 1
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd "${PROJECT_NAME}"
          git init
          cargo generate-lockfile
          mise lock
          git config --local user.name "Dummy User"
          git config --local user.email "dummy@example.com"
          git add .
          git commit -m "Initial commit"
          ../tests/scripts/run_ci "${CRATE_TYPE}"
        shell: bash

  sync-repo-dry-run:
    name: Sync Example Repo with Template (Dry Run)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        crate_type: ["bin", "lib"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/sync-repo
        with:
          crate-type: ${{ matrix.crate_type }}
          github-token: ${{ github.token }}
          git-user-name: "Dummy User"
          git-user-email: "dummy@example.com"
          dry-run: "true"

  lint-workflow:
    name: Lint (workflow)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          github_token: ${{ github.token }}
          persist_github_token: true
      - run: mise run ci:lint-workflow
        env:
          JACTIONLINT_ONLINE: 1
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash

  lint-spelling:
    name: Lint (spelling)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          github_token: ${{ github.token }}
          persist_github_token: true
      - run: mise run ci:lint-spelling
        shell: bash

  lint-markdown:
    name: Lint (markdown)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          github_token: ${{ github.token }}
          persist_github_token: true
      - run: mise run ci:lint-markdown
        shell: bash

  lint-editorconfig:
    name: Lint (editorconfig)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          github_token: ${{ github.token }}
          persist_github_token: true
      - run: mise run ci:lint-editorconfig
        shell: bash

  lint-shell:
    name: Lint (shell)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          github_token: ${{ github.token }}
          persist_github_token: true
      - run: mise run ci:lint-shell
        shell: bash

  lint-renovate:
    name: Lint (renovate)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          github_token: ${{ github.token }}
          persist_github_token: true
      - run: mise run ci:lint-renovate
        shell: bash

  ci-complete:
    name: ci-complete
    if: ${{ always() }}
    needs:
      - generate
      - sync-repo-dry-run
      - lint-workflow
      - lint-spelling
      - lint-markdown
      - lint-editorconfig
      - lint-shell
      - lint-renovate
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: CI complete
        env:
          RESULT: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: |
          if "${RESULT}"; then
            echo "CI succeeded"
          else
            echo "CI failed"
            exit 1
          fi
        shell: bash
