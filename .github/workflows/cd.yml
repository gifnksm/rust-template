name: Synchronize the example with the template
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    # Runs at 00:00 UTC everyday
    - cron: "0 0 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  MISE_CARGO_BINSTALL_ONLY: true

jobs:
  synchronize_example:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable]
        job:
          - crate_type: "bin"
          - crate_type: "lib"
    env:
      PROJECT_NAME: rust-template-generated-${{ matrix.job.crate_type }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - run: rustup toolchain add nightly --profile minimal
        shell: bash
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          github_token: ${{ github.token }}
          persist_github_token: true
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.UPDATE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.UPDATE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.PROJECT_NAME }}

      - run: cargo generate --name "${{ env.PROJECT_NAME }}" --path "template" --template-values-file tests/template_values.toml --${{matrix.job.crate_type}} --allow-commands
        shell: bash

      - name: Checkout example repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/${{ env.PROJECT_NAME }}
          path: example_repo
          token: ${{ steps.app-token.outputs.token }}

      - name: Update example repo
        run: |
          ./tests/scripts/update_repo example_repo ${{ env.PROJECT_NAME }}
          git -C example_repo add -N .
        shell: bash

      - name: Commit example repo changes
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          cd example_repo

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "nothing to commit";
            exit 0;
          fi

          app_user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config --local user.name "${APP_SLUG}[bot]"
          git config --local user.email "${app_user_id}+${APP_SLUG}[bot]@users.noreply.github.com"

          git add .
          git commit -m "automatic update" -m "from $GITHUB_REPOSITORY@$GITHUB_SHA"

          git show
        shell: bash

      - name: Test example repo
        run: |
          cd example_repo
          ../tests/scripts/run_ci "${{ matrix.job.crate_type }}"
        shell: bash

      - name: Push example repo
        run: |
          cd example_repo
          git push
        shell: bash
        if: ${{ startsWith(github.ref, 'refs/heads/main') }}

  cd-complete:
    needs:
      - synchronize_example
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: CD complete
        run: |
          if ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}; then
            echo "CD succeeded"
          else
            echo "CD failed"
            exit 1
          fi
        shell: bash
