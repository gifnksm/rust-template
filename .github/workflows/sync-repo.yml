name: Synchronize the example with the template
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    # Runs at 00:00 UTC everyday
    - cron: "0 0 * * *"

concurrency:
  group: sync-repo-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  MISE_CARGO_BINSTALL_ONLY: true
  MISE_LOCKED: true

jobs:
  sync-repo:
    name: Sync Example Repo with Template
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        rust: [stable]
        job:
          - crate_type: "bin"
          - crate_type: "lib"
    timeout-minutes: 5
    env:
      PROJECT_NAME: rust-template-generated-${{ matrix.job.crate_type }}
      CRATE_TYPE: ${{ matrix.job.crate_type }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --default
        shell: bash
      - run: rustup toolchain install nightly --profile minimal
        shell: bash
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          github_token: ${{ github.token }}
          persist_github_token: true
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.UPDATE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.UPDATE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.PROJECT_NAME }}
          permission-contents: write
          permission-workflows: write

      - run: MISE_LOCKED=false cargo generate --name "${PROJECT_NAME}" --path "template" --template-values-file tests/template_values.toml "--${CRATE_TYPE}" --allow-commands
        shell: bash

      - name: Checkout example repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/${{ env.PROJECT_NAME }}
          path: example_repo
          token: ${{ steps.app-token.outputs.token }}

      - name: Update example repo
        run: |
          ./tests/scripts/update_repo example_repo "${PROJECT_NAME}"
          git -C example_repo add -N .
        shell: bash

      - name: Commit example repo changes
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          cd example_repo

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "nothing to commit";
            exit 0;
          fi

          app_user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config --local user.name "${APP_SLUG}[bot]"
          git config --local user.email "${app_user_id}+${APP_SLUG}[bot]@users.noreply.github.com"

          git add .
          git commit -m "automatic update" -m "from $GITHUB_REPOSITORY@$GITHUB_SHA"

          git show
        shell: bash

      - name: Test example repo
        run: |
          cd example_repo
          ../tests/scripts/run_ci "${CRATE_TYPE}"
        shell: bash

      - name: Push example repo
        run: |
          cd example_repo
          git push
        shell: bash
        if: ${{ github.ref == 'refs/heads/main' }}

  sync-repo-complete:
    name: sync-repo-complete
    if: ${{ always() }}
    needs:
      - sync-repo
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: CD complete
        env:
          RESULT: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: |
          if "${RESULT}"; then
            echo "CD succeeded"
          else
            echo "CD failed"
            exit 1
          fi
        shell: bash
