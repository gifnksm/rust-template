name: Sync Example Repo with Template
on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Runs at 00:00 UTC everyday
    - cron: "0 0 * * *"

concurrency:
  group: sync-repo-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  MISE_CARGO_BINSTALL_ONLY: true
  MISE_LOCKED: true

jobs:
  sync-repo:
    name: Sync Example Repo with Template
    environment:
      name: example-repo-${{ matrix.crate_type }}
      url: ${{ steps.sync.outputs.commit-url }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        crate_type: ["bin", "lib"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.UPDATE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.UPDATE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: rust-template-generated-${{ matrix.crate_type }}
          permission-contents: write
          permission-workflows: write
      - id: get-app-user-id
        run: |
          app_user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          echo "app-user-id=${app_user_id}" >> "${GITHUB_OUTPUT}"
        env:
          GH_TOKEN: ${{ github.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        shell: bash
      - uses: $/.github/actions/sync-repo
        id: sync
        with:
          crate-type: ${{ matrix.crate_type }}
          github-token: ${{ github.token }}
          push-token: ${{ steps.app-token.outputs.token }}
          git-user-name: "${{ steps.app-token.outputs.app-slug }}[bot]"
          git-user-email: "${{ steps.get-app-user-id.outputs.app-user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          dry-run: "false"

  sync-repo-complete:
    name: sync-repo-complete
    if: ${{ always() }}
    needs:
      - sync-repo
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: CD complete
        env:
          RESULT: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: |
          if "${RESULT}"; then
            echo "CD succeeded"
          else
            echo "CD failed"
            exit 1
          fi
        shell: bash
