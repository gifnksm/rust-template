name: Sync Example Repo with Template
description: Update an example repository from the template, run CI checks, and optionally push changes

inputs:
  crate-type:
    description: "Rust crate type to generate and test (bin or lib)"
    required: true
  github-token:
    description: "GitHub token for tool downloads, example repository checkout, and API access during CI checks"
    required: true
  push-token:
    description: "GitHub token with permission to push changes to the example repository"
    required: false
  git-user-name:
    description: "Git author and committer name"
    required: true
  git-user-email:
    description: "Git author and committer email address"
    required: true
  dry-run:
    description: "Skip pushing changes to the example repository"
    default: "true"

outputs:
  commit-url:
    description: "URL of the pushed commit in the example repository"
    value: ${{ steps.create-commit-url.outputs.commit-url }}

runs:
  using: composite
  steps:
    - name: Set project name
      id: project
      env:
        CRATE_TYPE: ${{ inputs.crate-type }}
      run: |
        case "${CRATE_TYPE}" in
          bin | lib) ;;
          *)
            echo "Unsupported crate type: ${CRATE_TYPE}" >&2
            exit 1
            ;;
        esac
        echo "name=rust-template-generated-${CRATE_TYPE}" >> "${GITHUB_OUTPUT}"
      shell: bash
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: stable
    - run: rustup toolchain install nightly --profile minimal
      shell: bash
    - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      with:
        github_token: ${{ inputs.github-token }}
        persist_github_token: true
    - run: MISE_LOCKED=false cargo generate --name "${PROJECT_NAME}" --path "template" --template-values-file tests/template_values.toml "--${CRATE_TYPE}" --allow-commands
      env:
        PROJECT_NAME: ${{ steps.project.outputs.name }}
        CRATE_TYPE: ${{ inputs.crate-type }}
      shell: bash
    - name: Checkout example repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ github.repository_owner }}/${{ steps.project.outputs.name }}
        path: example_repo
        token: ${{ inputs.github-token }}
        persist-credentials: false
    - name: Update example repo
      run: |
        ./tests/scripts/update_repo example_repo "${PROJECT_NAME}"
        git -C example_repo add -N .
      env:
        PROJECT_NAME: ${{ steps.project.outputs.name }}
      shell: bash
    - name: Commit example repo changes
      id: commit-changes
      env:
        GIT_USER_NAME: ${{ inputs.git-user-name }}
        GIT_USER_EMAIL: ${{ inputs.git-user-email }}
      run: |
        cd example_repo
        if [[ -z "$(git status --porcelain)" ]]; then
          echo "nothing to commit";
          echo "updated=false" >> "${GITHUB_OUTPUT}";
          exit 0;
        fi
        git config --local user.name "${GIT_USER_NAME}"
        git config --local user.email "${GIT_USER_EMAIL}"
        git add .
        git commit -m "automatic update" -m "from $GITHUB_REPOSITORY@$GITHUB_SHA"
        echo "updated=true" >> "${GITHUB_OUTPUT}";
      shell: bash
    - name: Show example repo changes
      if: ${{ steps.commit-changes.outputs.updated == 'true' }}
      run: |
        cd example_repo
        git show
      shell: bash
    - name: Test example repo
      run: |
        cd example_repo
        ../tests/scripts/run_ci "${CRATE_TYPE}"
      env:
        CRATE_TYPE: ${{ inputs.crate-type }}
        JACTIONLINT_ONLINE: 1
        GITHUB_TOKEN: ${{ inputs.github-token }}
      shell: bash
    - name: Reset local commit
      if: ${{ steps.commit-changes.outputs.updated == 'true' }}
      run: git -C example_repo reset --mixed HEAD^
      shell: bash
    - name: Push verified commit
      id: push
      if: ${{ inputs.dry-run == 'false' && steps.commit-changes.outputs.updated == 'true' && github.ref == 'refs/heads/main' }}
      uses: suzuki-shunsuke/commit-action@5eaa5ecce3ffe93d09a85b946dc5136e3713b1b7 # v1.1.0
      with:
        github_token: ${{ inputs.push-token }}
        repository: ${{ github.repository_owner }}/${{ steps.project.outputs.name }}
        branch: main
        root_dir: example_repo
        commit_message: |-
          automatic update

          from ${{ github.repository }}@${{ github.sha }}
    - name: Create commit URL output
      id: create-commit-url
      if: ${{ inputs.dry-run == 'false' && steps.commit-changes.outputs.updated == 'true' && github.ref == 'refs/heads/main' }}
      env:
        COMMIT_SHA: ${{ steps.push.outputs.sha }}
        PROJECT_NAME: ${{ steps.project.outputs.name }}
      run: |
        echo "commit-url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY_OWNER}/${PROJECT_NAME}/commit/${COMMIT_SHA}" >> "${GITHUB_OUTPUT}"
      shell: bash
